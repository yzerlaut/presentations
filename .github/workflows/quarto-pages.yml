name: Render Quarto slides (commit HTML)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-slides
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render slides
        run: |
          quarto render slides --to revealjs
          printf '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=slides/demo-presentation.html"></head></html>' > docs/index.html

      - name: Commit rendered HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "render slides [skip ci]"
          git push
