title: Talk template (light)
author: Yann Zerlaut
version: 1.0.0
quarto-required: ">=1.4.0"
# 16:9 reveal.js talk template, light variant.  In a deck:   format: talk-light-revealjs
# (shared layout, filters & title slide are in ../talk-common/)
contributes:
  formats:
    revealjs:
      width: 1280               # 16:9
      height: 720
      margin: 0.06
      slide-number: true
      theme: [default, colors.scss, ../talk-common/common.scss]
      logo: Bottom-logo.svg
      template-partials: [../talk-common/title-slide.html]   # adds `location:`
      display: flex             # slides as flex columns: content centered vertically (common.scss)
      scrollable: false         # would clip the title lines
      date-format: long         # e.g. "October 16, 2026"
      talk-variant: light          # used by the talk-common filters & shortcodes
      filters:
        - ../talk-common/svg-layers.lua         # multi-layer svg figures: one layer per click
        - ../talk-common/title-background.lua   # title-slide background (lines + logos)
      title-slide-attributes:
        data-state: is-title-slide   # title layout, hides corner logo & bottom line
