# light variant of the talk template -- use in a talk with:
#   metadata-files: [light/talk.yml]
format:
  revealjs:
    theme: [default, light/colors.scss, common.scss]
    logo: light/Bottom-logo.svg
    template-partials: [title-slide.html]   # adds `location:`
    display: flex           # slides as flex columns: content centered vertically (common.scss)
    scrollable: false       # (repo default is true) would clip the title lines
filters:
  - svg-layers.lua         # multi-layer svg figures: one layer per click
  - title-background.lua   # title-slide background from `talk-bg`
# title-slide background (inlined by title-background.lua), order matters:
#   lines-top, lines-bottom, ICM, SU (sizes/positions in common.scss)
talk-dir: light      # folder of this variant's svgs, e.g. for logos in slides
date-format: long   # e.g. "October 16, 2026"
talk-bg: "light/lines-top.svg,light/lines-bottom.svg,light/ICM.svg,light/SU.svg"
title-slide-attributes:
  data-state: is-title-slide   # title layout, hides corner logo & bottom line
resources:
  - light/*.svg
