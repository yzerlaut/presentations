<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Drawing canvas for a full slide frame (talk template, dark variant).
     1180x570 px = the content area of a slide (1280x720 minus title & bottom
     line, minus the 50px side indents, clear of the corner logo): 1 px here = 1 px on the slide, so
     32px text = slide body text.  Page color is only the editor background
     (the export stays transparent).  Theme colors are in the document swatches.
     In a talk:   ![](my-figure.svg){.frame}                                  -->

<svg
   width="1180"
   height="570"
   viewBox="0 0 1180 570"
   version="1.1"
   id="svg5"
   sodipodi:docname="frame.svg"
   inkscape:version="1.3.1 (91b66b0, 2023-11-16)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns:osb="http://www.openswatchbook.org/uri/2009/osb">
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#1f1f1f"
     bordercolor="#888888"
     borderopacity="1"
     inkscape:pageopacity="0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#555555"
     inkscape:document-units="px"
     showguides="true"
     inkscape:current-layer="layer2"
     inkscape:showpageshadow="2"
     inkscape:zoom="0.38892798"
     inkscape:cx="574.65652"
     inkscape:cy="277.68637"
     inkscape:window-width="1352"
     inkscape:window-height="845"
     inkscape:window-x="0"
     inkscape:window-y="33"
     inkscape:window-maximized="0">
    <sodipodi:guide
       position="590.0,570"
       orientation="1,0"
       id="guide-center-v"
       inkscape:label="center"
       inkscape:locked="false" />
    <sodipodi:guide
       position="0,285.0"
       orientation="0,-1"
       id="guide-center-h"
       inkscape:label="center"
       inkscape:locked="false" />
  </sodipodi:namedview>
  <defs
     id="defs1">
    <inkscape:perspective
       sodipodi:type="inkscape:persp3d"
       inkscape:vp_x="316.24159 : 471.32431 : 1"
       inkscape:vp_y="216.63758 : 842.80715 : 0"
       inkscape:vp_z="1242.2962 : 196.7945 : 1"
       inkscape:persp3d-origin="758.68827 : 253.99273 : 1"
       id="perspective6" />
    <linearGradient
       id="swatch-main"
       inkscape:swatch="solid"
       osb:paint="solid">
      <stop
         style="stop-color:#a0a6c7;stop-opacity:1"
         offset="0"
         id="stop1" />
    </linearGradient>
    <linearGradient
       id="swatch-accent"
       inkscape:swatch="solid"
       osb:paint="solid">
      <stop
         style="stop-color:#b17d85;stop-opacity:1"
         offset="0"
         id="stop2" />
    </linearGradient>
    <linearGradient
       id="swatch-orange"
       inkscape:swatch="solid"
       osb:paint="solid">
      <stop
         style="stop-color:#ffb888;stop-opacity:1"
         offset="0"
         id="stop3" />
    </linearGradient>
    <linearGradient
       id="swatch-text"
       inkscape:swatch="solid"
       osb:paint="solid">
      <stop
         style="stop-color:#e4e5ee;stop-opacity:1"
         offset="0"
         id="stop4" />
    </linearGradient>
    <linearGradient
       id="swatch-muted"
       inkscape:swatch="solid"
       osb:paint="solid">
      <stop
         style="stop-color:#9a9cb0;stop-opacity:1"
         offset="0"
         id="stop5" />
    </linearGradient>
  </defs>
  <g
     inkscape:groupmode="layer"
     inkscape:label="drawing"
     id="layer-drawing">
    <rect
       style="fill:#a0a6c7;fill-rule:evenodd;stroke:#b17d85;stroke-width:6.80315;stroke-linejoin:bevel;paint-order:markers fill stroke"
       id="rect5"
       width="379.19492"
       height="260.84744"
       x="84.533897"
       y="270.50845" />
    <rect
       style="fill:#a0a6c7;fill-rule:evenodd;stroke:#b17d85;stroke-width:6.80315;stroke-linejoin:bevel;paint-order:markers fill stroke"
       id="rect6"
       width="410.59323"
       height="132.83897"
       x="362.28812"
       y="89.364388" />
  </g>
  <g
     inkscape:groupmode="layer"
     id="layer2"
     inkscape:label="drawing 1">
    <ellipse
       style="fill:#a0a6c7;fill-rule:evenodd;stroke:#b17d85;stroke-width:6.80315;stroke-linejoin:bevel;paint-order:markers fill stroke"
       id="path1"
       cx="926.9068"
       cy="416.52957"
       rx="116.98824"
       ry="107.98914" />
  </g>
</svg>
